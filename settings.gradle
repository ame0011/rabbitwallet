pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

plugins {
    // Provisions a JDK for the Gradle daemon when the required one is not installed locally.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

include ':app'